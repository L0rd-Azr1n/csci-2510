<html>
    <head>
        <title>The Nexus
        </title>
    </head>
    <body>
        <canvas id="canv">

        </canvas>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            //expand canvas
            canvas.width = window.innerWidth
            canvas.Height = window.innerHeight

            //signal to context to draw smth
            ctx.save()
            
            //declare center
            ctx.translate(50, 50)

            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(55, 0)
            ctx.lineTo(0, 40)

            
            ctx.fillStyle = "black"
            ctx.fill()

            //signal finished
            ctx.restore()
        </script>
    </body>
</html>
